<section class="w-full">
    <div class="mx-auto w-full">
        <div class="overflow-hidden rounded-2xl bg-blue-500 text-primary-foreground">
            <div class="grid min-h-[360px] grid-cols-1 gap-2 overflow-hidden p-10 md:grid-cols-2 md:p-10">
                <!-- Left Side - Text -->
                <div class="flex flex-col justify-center space-y-6 text-white md:space-y-4">
                    <h2 class="text-2xl font-bold tracking-tight md:text-2xl">
                        Download the Aarogyam By Aabind App
                    </h2>
                    <p class="max-w-xl text-base leading-7 text-primary-foreground/90 md:text-sm">
                        Aarogyam by Aabind is your trusted companion for managing your health journey. From preventive care to recovery and beyond, Aarogyam helps you stay connected to your healthcare journey, supporting your wellbeing every step of the way.
                    </p>
                    <!-- App Store Buttons -->
                    <div class="flex flex-wrap gap-4">
                        <div class="flex justify-center space-x-4 md:justify-start">
                            <!-- App Store -->
                            <a [href]="appStoreUrl" target="_blank" rel="noopener noreferrer" class="hover:underline">
                                <img src="assets/appstore.svg" alt="Download on the App Store"
                                    class="h-auto w-[160px] transition-transform duration-200 hover:scale-110 md:w-[180px]" />
                            </a>
                            <!-- Google Play -->
                            <a [href]="playStoreUrl" target="_blank" rel="noopener noreferrer" class="hover:underline">
                                <img src="assets/playstore.svg" alt="Get it on Google Play"
                                    class="h-auto w-[160px] transition-transform duration-200 hover:scale-110 md:w-[180px]" />
                            </a>
                        </div>
                    </div>
                </div>
                <!-- Right Side - Image -->
                <div class="relative flex h-full items-end justify-center overflow-hidden md:justify-end">
                    <img src="/prx-care-mockup.png" alt="Aarogyam by Aabind app screens"
                        class="block w-auto max-w-full object-contain" />
                </div>
            </div>
        </div>
    </div>
</section>
